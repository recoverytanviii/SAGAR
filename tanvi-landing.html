<style>
  :root {
    --background: oklch(0.16 0.02 265);
    --foreground: oklch(0.95 0.01 265);
    --card: oklch(0.21 0.02 265);
    --muted-foreground: oklch(0.68 0.02 265);
    --primary: oklch(0.65 0.19 275);
    --primary-foreground: oklch(0.98 0.01 265);
    --border: oklch(1 0 0 / 10%);
    --glow-blue: oklch(0.68 0.17 255);
    --glow-purple: oklch(0.62 0.22 290);
    --glow-pink: oklch(0.63 0.24 5);
    --glow-gold: oklch(0.82 0.15 85);
    --glow-green: oklch(0.75 0.19 155);
    --glow-green-deep: oklch(0.62 0.17 155);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; border-color: var(--border); }
  html, body { height: 100%; }
  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
    scrollbar-color: oklch(0.12 0.01 265) oklch(0.18 0.02 265);
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: oklch(0.18 0.02 265); }
  ::-webkit-scrollbar-thumb { background: oklch(0.1 0.01 265); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: oklch(0.14 0.01 265); }

  main {
    position: relative;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 4rem 1rem;
  }
  .glow { pointer-events: none; position: absolute; border-radius: 9999px; filter: blur(120px); animation: glow-pulse 3.2s ease-in-out infinite; }
  .glow-purple { top: -10rem; left: -10rem; height: 32rem; width: 32rem; background: color-mix(in oklab, var(--glow-purple) 25%, transparent); }
  .glow-blue { right: -10rem; bottom: -10rem; height: 32rem; width: 32rem; background: color-mix(in oklab, var(--glow-blue) 20%, transparent); animation-delay: 1.6s; }
  .star { pointer-events: none; position: absolute; border-radius: 9999px; animation: twinkle 2.8s ease-in-out infinite; }
  .star-blue { background: var(--glow-blue); }
  .star-gold { background: var(--glow-gold); box-shadow: 0 0 10px 2px oklch(0.82 0.15 85 / 0.6); }

  .wrap { position: relative; width: 100%; max-width: 28rem; animation: fade-in 0.7s ease-out both; }
  .card {
    border-radius: 1.5rem;
    border: 1px solid var(--border);
    background: color-mix(in oklab, var(--card) 80%, transparent);
    backdrop-filter: blur(8px);
    padding: 3rem 2rem;
    text-align: center;
    box-shadow: 0 24px 80px -24px oklch(0.62 0.22 290 / 0.45);
  }
  .logo-wrap { position: relative; margin: 0 auto; display: flex; width: 8rem; align-items: center; justify-content: center; }
  .logo-halo { position: absolute; inset: -1.5rem; border-radius: 9999px; background: color-mix(in oklab, var(--glow-purple) 25%, transparent); filter: blur(1rem); }
  .logo-frame { position: relative; width: 100%; border-radius: 9999px; box-shadow: 0 0 0 2px var(--background); }
  .logo-frame img { position: relative; display: block; width: 100%; height: auto; border-radius: 9999px; }

  h1 {
    margin-top: 1.5rem;
    font-size: 1.875rem;
    font-weight: 800;
    letter-spacing: 0.05em;
    background: linear-gradient(to right, var(--glow-blue), var(--glow-pink), var(--glow-purple));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: drift 6s ease-in-out infinite alternate;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 0.5rem;
    margin-top: 0.75rem;
    border-radius: 9999px;
    border: 1px solid color-mix(in oklab, var(--primary) 40%, transparent);
    background: color-mix(in oklab, var(--primary) 10%, transparent);
    padding: 0.375rem 1rem;
    font-size: 0.75rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--primary);
  }
  .badge svg { width: 0.875rem; height: 0.875rem; }
  .desc { margin-top: 1.25rem; font-size: 0.875rem; line-height: 1.625; color: var(--muted-foreground); }

  .cta-zone { margin-top: 1.75rem; }
  .cta {
    display: inline-flex; width: 100%; align-items: center; justify-content: center; gap: 0.625rem;
    border-radius: 0.75rem;
    background: linear-gradient(to right, var(--glow-green), var(--glow-green-deep));
    padding: 0.875rem 1.5rem;
    font-size: 0.875rem; font-weight: 800;
    text-transform: uppercase; letter-spacing: 0.1em;
    text-decoration: none;
    color: var(--primary-foreground);
    box-shadow: 0 10px 30px -8px oklch(0.62 0.17 155 / 0.6);
    transition: transform 0.2s ease;
    position: relative; overflow: hidden;
  }
  .cta:hover { transform: scale(1.02); }
  .cta:active { transform: scale(0.99); }
  .cta svg { width: 1rem; height: 1rem; }
  .cta::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
    background: linear-gradient(90deg, transparent, oklch(1 0 0 / 0.35), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }
  .footer { margin-top: 1.5rem; font-size: 0.75rem; color: color-mix(in oklab, var(--muted-foreground) 70%, transparent); }
  .footer a { color: inherit; text-decoration: none; transition: color 0.2s; }
  .footer a:hover { color: var(--foreground); }

  @keyframes glow-pulse { 0%,100% { opacity: 0.55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
  @keyframes twinkle { 0%,100% { opacity: 0.1; transform: scale(0.8); } 50% { opacity: 0.9; transform: scale(1.15); } }
  @keyframes shimmer { 0% { transform: translateX(-150%) skewX(-18deg); } 100% { transform: translateX(250%) skewX(-18deg); } }
  @keyframes fade-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes drift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
</style>
</head>
